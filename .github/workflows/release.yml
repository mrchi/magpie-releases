name: Release

# Builds, signs, notarises and publishes magpie. yetone/magpie is private;
# pushing a v* tag there dispatches here, and the builds land on this repo's
# Releases, where anyone can download them.
#
# macOS signing is optional: without MAC_CERTIFICATE_P12 the app is only
# ad-hoc signed (still runs after right-click → Open). With it the app is
# signed with the Developer ID under the hardened runtime, the dmg notarised
# and the ticket stapled to both the dmg and the app inside the zip.
# Notarisation takes an App Store Connect API key (APPLE_API_KEY_P8,
# APPLE_API_KEY_ID, APPLE_API_ISSUER) or, failing that, an Apple ID
# (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID).
#
# The source is checked out with MAGPIE_DEPLOY_KEY, a read-only deploy key
# on yetone/magpie.

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref of yetone/magpie to build (tag or branch)'
        required: true
        type: string
      version:
        description: 'Version to release (e.g., 0.1.0 — no v prefix)'
        required: true
        type: string

env:
  REF: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
  VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout magpie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: yetone/magpie
          ssh-key: ${{ secrets.MAGPIE_DEPLOY_KEY }}
          ref: ${{ env.REF }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Probe macOS signing secrets
        id: signing
        env:
          P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
        run: |
          if [ -n "$P12" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::MAC_CERTIFICATE_P12 not set — the mac build will be ad-hoc signed and not notarised."
          fi

      - name: Import macOS certificates
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f $RUNNER_TEMP/certificate.p12

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in MAC_CERTIFICATE_P12"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> $GITHUB_ENV

      - name: Build magpie.app
        run: make app VERSION="$VERSION"

      - name: Sign magpie.app
        run: |
          if [ -n "$IDENTITY" ]; then
            codesign --force --options runtime --timestamp --sign "$IDENTITY" magpie.app
          else
            codesign --force --sign - magpie.app
          fi
          codesign --verify --strict --verbose=2 magpie.app
          codesign -dv --verbose=2 magpie.app 2>&1 | grep -E 'Authority|TeamIdentifier|flags|Identifier'

      - name: Build dmg
        run: |
          DMG=magpie-darwin-${{ matrix.arch }}.dmg
          mkdir -p $RUNNER_TEMP/dmg
          cp -R magpie.app $RUNNER_TEMP/dmg/
          ln -s /Applications $RUNNER_TEMP/dmg/Applications
          hdiutil create -volname magpie -srcfolder $RUNNER_TEMP/dmg -ov -format UDZO "$DMG"
          if [ -n "$IDENTITY" ]; then
            codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          fi
          echo "DMG=$DMG" >> $GITHUB_ENV

      - name: Notarise and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" > $RUNNER_TEMP/AuthKey.p8
            AUTH=(--key $RUNNER_TEMP/AuthKey.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          else
            AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          # The dmg's ticket covers the app inside it too, so one submission
          # does for both: staple the dmg, and the app for the zip.
          OUT=$(xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 30m --output-format json)
          echo "$OUT"
          ID=$(echo "$OUT" | jq -r .id)
          STATUS=$(echo "$OUT" | jq -r .status)
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$ID" "${AUTH[@]}" || true
            rm -f $RUNNER_TEMP/AuthKey.p8
            echo "::error::Notarisation $STATUS"
            exit 1
          fi
          rm -f $RUNNER_TEMP/AuthKey.p8
          xcrun stapler staple "$DMG"
          xcrun stapler staple magpie.app
          spctl --assess --type execute --verbose=2 magpie.app
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Zip magpie.app
        run: ditto -c -k --keepParent magpie.app magpie-darwin-${{ matrix.arch }}.zip

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-darwin-${{ matrix.arch }}
          path: |
            magpie-darwin-*.dmg
            magpie-darwin-*.zip
          if-no-files-found: error

  # The terminal-only magpie (no GUI, no cgo) cross-compiles from one runner.
  cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout magpie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: yetone/magpie
          ssh-key: ${{ secrets.MAGPIE_DEPLOY_KEY }}
          ref: ${{ env.REF }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make release-cli VERSION="$VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-cli
          path: dist/magpie-cli-*
          if-no-files-found: error

  publish:
    needs: [mac, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout magpie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: yetone/magpie
          ssh-key: ${{ secrets.MAGPIE_DEPLOY_KEY }}
          ref: ${{ env.REF }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          ls -la

      - name: Generate changelog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          CURRENT_TAG="v$VERSION"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${CURRENT_TAG}$" | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Commits since $PREV_TAG"
          COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"%s" --no-merges)
          echo "$COMMITS"

          CHANGELOG=""
          if [ -n "$OPENAI_API_KEY" ] && [ -n "$COMMITS" ]; then
            PROMPT="Based on the following git commit messages, generate a concise and user-friendly changelog in markdown format. Group changes by category (e.g., Features, Bug Fixes, Improvements). Only include meaningful changes, skip trivial commits. Use clear, non-technical language where possible. Output ONLY the changelog content without any preamble.

          Commit messages:
          $COMMITS"
            RESPONSE=$(curl -s https://api.openai.com/v1/responses \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -d "$(jq -n --arg prompt "$PROMPT" '{"model": "gpt-5.4", "input": [{"role": "user", "content": $prompt}]}')")
            CHANGELOG=$(echo "$RESPONSE" | jq -r '[.output[] | select(.type == "message") | .content[] | select(.type == "output_text") | .text] | join("\n") // empty')
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(printf '### Changes\n\n'; echo "${COMMITS:-Various improvements and bug fixes}" | sed 's/^/- /')
          fi

          {
            echo "$CHANGELOG"
            echo
            echo "### Install"
            echo
            echo "- **macOS (Apple Silicon):** \`magpie-darwin-arm64.dmg\`"
            echo "- **macOS (Intel):** \`magpie-darwin-amd64.dmg\`"
            echo "- **Terminal only:** \`magpie-cli-<os>-<arch>\`"
          } > $RUNNER_TEMP/changelog.md
          cat $RUNNER_TEMP/changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: magpie v${{ env.VERSION }}
          draft: false
          body_path: ${{ runner.temp }}/changelog.md
          files: dist/*

      - name: Probe Discord webhook
        id: discord
        env:
          HOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "Discord webhook not set — skipping announcement."
          fi

      - name: Post to Discord
        if: steps.discord.outputs.enabled == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
          MESSAGE="## magpie v$VERSION

          $(cat $RUNNER_TEMP/changelog.md)

          **Download:** ${RELEASE_URL}"
          if [ ${#MESSAGE} -gt 1990 ]; then
            MESSAGE="${MESSAGE:0:1987}..."
          fi
          jq -n --arg content "$MESSAGE" '{content: $content}' | \
            curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
